naftiko: 1.0.0-alpha2
info:
  label: Liberty Mutual Renters Insurance API — Policies
  description: 'Liberty Mutual Renters Insurance API — Policies. 1 operations. Lead operation: Bind Policy. Self-contained
    Naftiko capability covering one Liberty Mutual Insurance business surface.'
  tags:
  - Liberty Mutual Insurance
  - Policies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LIBERTY_MUTUAL_INSURANCE_API_KEY: LIBERTY_MUTUAL_INSURANCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: renters-insurance-policies
    baseUri: https://api.libertymutual.com
    description: Liberty Mutual Renters Insurance API — Policies business capability. Self-contained, no shared references.
    resources:
    - name: policies
      path: /policies
      operations:
      - name: bindpolicy
        method: POST
        description: Bind Policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: renters-insurance-policies-rest
    port: 8080
    description: REST adapter for Liberty Mutual Renters Insurance API — Policies. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/policies
      name: policies
      description: REST surface for policies.
      operations:
      - method: POST
        name: bindpolicy
        description: Bind Policy
        call: renters-insurance-policies.bindpolicy
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: renters-insurance-policies-mcp
    port: 9090
    transport: http
    description: MCP adapter for Liberty Mutual Renters Insurance API — Policies. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: bind-policy
      description: Bind Policy
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: renters-insurance-policies.bindpolicy
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
